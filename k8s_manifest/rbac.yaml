# =============================================================================
# RBAC 구성
#
# 이 애플리케이션은 K8s API와 통신하지 않으므로:
#   - Role / ClusterRole       → 불필요
#   - RoleBinding              → 불필요
#   - ServiceAccount만 생성하되 automountServiceAccountToken: false로
#     API 토큰 마운트를 차단하여 보안 강화
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: hwp-converter-sa
  namespace: hwp-converter
  labels:
    app.kubernetes.io/name: hwp-converter
automountServiceAccountToken: false

# Role / RoleBinding이 필요한 경우:
#   - Pod 내부에서 kubectl, K8s client-go 등으로 API 호출 시
#   - ConfigMap/Secret을 런타임에 동적으로 읽어야 할 때
#   - 다른 Pod/Service 상태를 조회해야 할 때
# 현재 이 앱은 파일 업로드 → 변환 → 응답만 수행하므로 해당 없음
